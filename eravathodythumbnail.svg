<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="50%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Subtle Loom Accent Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Woven Loom Pattern -->
    <pattern id="loomPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <circle cx="20" cy="20" r="1.5" fill="rgba(255,255,255,0.07)"/>
      <line x1="0" y1="0" x2="40" y2="40" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1400" height="780" fill="url(#bgGrad)"/>
  <rect width="1400" height="780" fill="url(#loomPattern)"/>
  <rect width="1400" height="780" fill="url(#glowGrad)"/>

  <!-- Border & Frame Accent -->
  <rect x="24" y="24" width="1352" height="732" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Center Craft & Typography Block -->
  <g transform="translate(700, 390)" text-anchor="middle">
    <!-- Traditional Weaving Warp Lines Graphic -->
    <g opacity="0.4" transform="translate(0, -110)">
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6"/>
      <line x1="-100" y1="12" x2="100" y2="12" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 8"/>
      <line x1="-60" y1="24" x2="60" y2="24" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- Eyebrow Tag -->
    <rect x="-190" y="-85" width="380" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="0" y="-64" font-family="'Space Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#a1a1aa" letter-spacing="3">CRAFT CLUSTER DOCUMENTATION · NIFT</text>

    <!-- Main Title -->
    <text x="0" y="20" font-family="'Space Mono', monospace, 'Syne', sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="4">ERAVATHODY WEAVERS</text>

    <!-- Subtitle -->
    <text x="0" y="65" font-family="'Space Mono', monospace, sans-serif" font-size="14" font-weight="400" fill="#71717a" letter-spacing="2">TRADITIONAL HANDLOOM HERITAGE &amp; DESIGN SYSTEM</text>

    <!-- Weave Motif Indicator -->
    <g transform="translate(0, 110)" opacity="0.6">
      <circle cx="-24" cy="0" r="3" fill="#ffffff"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="24" cy="0" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- Corner Brackets -->
  <path d="M 44 64 L 44 44 L 64 44" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <path d="M 1356 64 L 1356 44 L 1336 44" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <path d="M 44 716 L 44 736 L 64 736" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <path d="M 1356 716 L 1356 736 L 1336 736" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>

